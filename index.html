
</form>
</div>
</div>

<script>
const slides = Array.from(document.querySelectorAll(".slide"));
const progress = document.getElementById("progress");
const form = document.getElementById("giftForm");
const errorBox = document.getElementById("error");
let current = 0;

function showSlide(n) {
 current = Math.max(0, Math.min(n, slides.length - 1));
 slides.forEach((slide, i) => slide.classList.toggle("active", i === current));
 progress.textContent = current === 0
   ? "A little surprise for you ❤️"
   : "Slide " + (current + 1) + " of " + slides.length + " 💗";
 errorBox.textContent = "";
 window.scrollTo({top: 0, behavior: "smooth"});
}

function next() {
 if (current >= 3 && current <= 10) {
   const group = slides[current].querySelector('input[type="radio"]');
   if (group) {
     const selected = slides[current].querySelector('input[type="radio"]:checked');
     if (!selected) {
       errorBox.textContent = "Pehle ek option choose karo, birthday girl ❤️";
       return;
     }
   }
 }
 showSlide(current + 1);
}
function prev() { showSlide(current - 1); }

form.addEventListener("submit", function(event) {
 const giftSlides = slides.filter(slide => slide.classList.contains("gift"));
 for (const slide of giftSlides) {
   if (!slide.querySelector('input[type="radio"]:checked')) {
     event.preventDefault();
     showSlide(slides.indexOf(slide));
     errorBox.textContent = "Is slide par bhi ek gift select karna hai ❤️";
     return;
   }
 }
});
</script>
</body>
</html>
